name: vgm-chip-spatial

on:
  push:
    branches: [main]
    paths:
      - vgm-request.json
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact private Omniphony GitLab commit SHA
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: vgm-chip-spatial
  cancel-in-progress: true

jobs:
  verify-cpp20:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Read public opaque request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve exact canonical SHA
        shell: pwsh
        id: request
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $sha = '${{ inputs.source_sha }}'
          } else {
            $request = Get-Content vgm-request.json -Raw -Encoding UTF8 | ConvertFrom-Json
            if ([string]$request.schema -ne 'omniphony-vgm-github-build-request/1') { throw 'Invalid request schema' }
            $sha = [string]$request.source_sha
          }
          if ($sha -notmatch '^[0-9a-f]{40}$') { throw 'Invalid source SHA' }
          "source_sha=$sha" >> $env:GITHUB_OUTPUT
      - name: Retrieve bounded private VGM compile snapshot
        id: source
        shell: pwsh
        env:
          SOURCE_SHA: '${{ steps.request.outputs.source_sha }}'
        run: |
          $audience = 'helix-runner-source-relay'
          $oidc = Invoke-RestMethod -Method Get -Uri "$env:ACTIONS_ID_TOKEN_REQUEST_URL&audience=$audience" -Headers @{Authorization = "Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN"}
          if (-not $oidc.value) { throw 'GitHub OIDC unavailable' }
          $body = @{action='read'; project_key='omniphony'; source_sha=$env:SOURCE_SHA} | ConvertTo-Json -Compress
          $relay = 'https://fpzqpoaeaydcrlvbxgwo.supabase.co/functions/v1/github-compile-source'
          $snapshot = Invoke-RestMethod -Method Post -Uri $relay -Headers @{Authorization="Bearer $($oidc.value)"} -ContentType 'application/json' -Body $body
          if ($snapshot.schema -ne 'helix/github-compile-source/2' -or $snapshot.project_key -ne 'omniphony' -or $snapshot.source_sha -ne $env:SOURCE_SHA) { throw 'Untrusted snapshot identity' }
          $expected = @(
            'modules/vgm/ChipCrossfeed.hpp',
            'modules/vgm/ChipIsolationDispatch.hpp',
            'modules/vgm/ChipIsolationPlan.hpp',
            'modules/vgm/ChipPcm71.hpp',
            'modules/vgm/chip-spatial-bed-test.cpp',
            'modules/vgm/foo_input_vgm/src/ChipHardwarePan.hpp',
            'modules/vgm/foo_input_vgm/src/ChipSpatialBed.hpp',
            'modules/vgm/foo_input_vgm/src/ChipVoiceTimeline.hpp',
            'modules/vgm/ym2612-fm-surround-experiment.cpp',
            'modules/vgm/ym2612-full-chip-surround-experiment.cpp'
          )
          if (@($snapshot.files).Count -ne $expected.Count) { throw 'Unapproved snapshot file count' }
          $root = Join-Path $env:RUNNER_TEMP 'private-vgm-compile'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          foreach ($file in @($snapshot.files)) {
            $relative = [string]$file.path
            if ($relative -notin $expected) { throw "Disallowed private path: $relative" }
            $dest = Join-Path $root $relative
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $dest) | Out-Null
            [IO.File]::WriteAllBytes($dest, [Convert]::FromBase64String([string]$file.content_b64))
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $dest).Hash.ToLowerInvariant()
            if ($hash -ne [string]$file.sha256) { throw "File hash mismatch: $relative" }
          }
          "source_dir=$root" >> $env:GITHUB_OUTPUT
          Write-Host "OMNIPHONy_VGM_PRIVATE_SOURCE_VERIFIED count=$($expected.Count) sha=$env:SOURCE_SHA"
      - name: Compile and run C++20 chip-spatial tests with MSVC
        shell: pwsh
        working-directory: '${{ steps.source.outputs.source_dir }}'
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $install = (& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          if (-not $install) { throw 'MSVC not installed on hosted runner' }
          $devcmd = Join-Path $install 'Common7/Tools/VsDevCmd.bat'
          $command = ('"' + $devcmd + '" -arch=x64 -host_arch=x64 >nul && cl /nologo /std:c++20 /EHsc /W4 /Fe:chip-spatial-bed-test.exe modules\vgm\chip-spatial-bed-test.cpp && chip-spatial-bed-test.exe')
          cmd.exe /d /s /c $command
          if ($LASTEXITCODE -ne 0) { throw "MSVC spatial test failed: $LASTEXITCODE" }
      - name: Build and run real two-voice YM2612 libvgm surround experiment
        id: fm
        shell: pwsh
        env:
          VGM_PRIVATE_SOURCE: '${{ steps.source.outputs.source_dir }}'
        run: |
          $ErrorActionPreference = 'Stop'
          $deps = Join-Path $env:RUNNER_TEMP 'fm-public-deps'
          New-Item -ItemType Directory -Force $deps | Out-Null
          git clone --depth 1 https://github.com/ValleyBell/libvgm.git (Join-Path $deps 'libvgm')
          if ($LASTEXITCODE -ne 0) { throw 'libvgm checkout failed' }
          git clone --depth 1 https://github.com/madler/zlib.git (Join-Path $deps 'zlib')
          if ($LASTEXITCODE -ne 0) { throw 'zlib checkout failed' }
          $libvgm = Join-Path $deps 'libvgm'
          $zlib = Join-Path $deps 'zlib'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $version = (& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationVersion).Trim()
          $generator = if ($version.StartsWith('18.')) { 'Visual Studio 18 2026' } elseif ($version.StartsWith('17.')) { 'Visual Studio 17 2022' } else { throw "Unsupported MSVC version: $version" }
          Write-Host "FM_COMPILER_TOOLCHAIN version=$version generator=$generator"
          cmake -S $zlib -B (Join-Path $deps 'zlib-build') -G $generator -A x64 -DZLIB_BUILD_EXAMPLES=OFF
          if ($LASTEXITCODE -ne 0) { throw 'zlib CMake configure failed' }
          cmake --build (Join-Path $deps 'zlib-build') --config Release
          if ($LASTEXITCODE -ne 0) { throw 'zlib CMake build failed' }
          $zliblib = Get-ChildItem (Join-Path $deps 'zlib-build') -Recurse -Filter '*.lib' | Where-Object { $_.Name -in @('libzs.lib','zs.lib','zlibstatic.lib','zlib.lib','zlibstaticd.lib') } | Select-Object -First 1
          if (-not $zliblib) { throw 'zlib static library not found' }
          $cmakesrc = Join-Path $deps 'fm-experiment'
          New-Item -ItemType Directory -Force $cmakesrc | Out-Null
          $env:VGM_BUILD_LIBVGM = $libvgm
          @'
          cmake_minimum_required(VERSION 3.20)
          project(ym2612_spatial_experiment LANGUAGES C CXX)
          add_subdirectory("$ENV{VGM_BUILD_LIBVGM}" libvgm-build EXCLUDE_FROM_ALL)
          add_executable(fm-surround "$ENV{VGM_PRIVATE_SOURCE}/modules/vgm/ym2612-fm-surround-experiment.cpp")
          target_include_directories(fm-surround PRIVATE "$ENV{VGM_BUILD_LIBVGM}")
          target_compile_features(fm-surround PRIVATE cxx_std_20)
          target_link_libraries(fm-surround PRIVATE vgm-player vgm-emu vgm-utils)
          add_executable(fm-full "$ENV{VGM_PRIVATE_SOURCE}/modules/vgm/ym2612-full-chip-surround-experiment.cpp")
          target_include_directories(fm-full PRIVATE "$ENV{VGM_BUILD_LIBVGM}")
          target_compile_features(fm-full PRIVATE cxx_std_20)
          target_link_libraries(fm-full PRIVATE vgm-player vgm-emu vgm-utils)
          '@ | Set-Content (Join-Path $cmakesrc 'CMakeLists.txt') -Encoding ascii
          $cmakebuild = Join-Path $deps 'fm-build'
          cmake -S $cmakesrc -B $cmakebuild -G $generator -A x64 -DZLIB_LIBRARY="$($zliblib.FullName)" -DZLIB_INCLUDE_DIR="$zlib" -DBUILD_LIBAUDIO=OFF -DBUILD_PLAYER=OFF -DBUILD_VGM2WAV=OFF -DBUILD_TESTS=OFF -DUSE_SANITIZERS=OFF -DUTIL_CHARCNV_ICONV=OFF -DUTIL_CHARCNV_WINAPI=ON
          if ($LASTEXITCODE -ne 0) { throw 'FM experiment configure failed' }
          cmake --build $cmakebuild --config Release --target fm-surround --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'FM experiment compilation failed' }
          $exe = Get-ChildItem $cmakebuild -Recurse -Filter 'fm-surround.exe' | Select-Object -First 1
          if (-not $exe) { throw 'FM experiment executable not found' }
          $wav = Join-Path $env:RUNNER_TEMP 'ym2612-real-emulator-7.1.wav'
          & $exe.FullName $wav
          if ($LASTEXITCODE -ne 0) { throw "Real YM2612 experiment failed: $LASTEXITCODE" }
          if (-not (Test-Path $wav)) { throw 'No 7.1 synthetic demo WAV produced' }
          Write-Host "FM_EMULATOR_EXPERIMENT_VERIFIED $wav"
          cmake --build $cmakebuild --config Release --target fm-full --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'Six-channel FM/DAC experiment compilation failed' }
          $full = Get-ChildItem $cmakebuild -Recurse -Filter 'fm-full.exe' | Select-Object -First 1
          if (-not $full) { throw 'Six-channel FM/DAC executable missing' }
          $fullwav = Join-Path $env:RUNNER_TEMP 'ym2612-six-fm-7.1.wav'
          & $full.FullName $fullwav
          if ($LASTEXITCODE -ne 0) { throw "FM6/DAC/CH3 real-core experiment failed: $LASTEXITCODE" }
          if (-not (Test-Path $fullwav)) { throw 'Six-FM 7.1 WAV missing' }
          Write-Host "YM2612_FULL_CHIP_VERIFIED $fullwav"

          'fm_pass=true' >> $env:GITHUB_OUTPUT
      - name: Upload synthetic FM surround demo
        if: steps.fm.outputs.fm_pass == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ym2612-real-emulator-7-1-wav
          path: |
            ${{ runner.temp }}/ym2612-real-emulator-7.1.wav
            ${{ runner.temp }}/ym2612-six-fm-7.1.wav
          retention-days: 7
          if-no-files-found: error
      - name: Store private-source-free compile receipt
        shell: pwsh
        env:
          SOURCE_SHA: '${{ steps.request.outputs.source_sha }}'
        run: |
          $receipt = @{schema='omniphony/vgm-chip-spatial-test/1'; source_sha=$env:SOURCE_SHA; runner='github-hosted/windows-2025'; result='cpp20-msvc-pass'; completed_at=[DateTimeOffset]::UtcNow.ToString('O')}
          $receipt | ConvertTo-Json | Set-Content -Path "$env:RUNNER_TEMP\chip-spatial-receipt.json" -Encoding UTF8
      - name: Upload receipt only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omniphony-vgm-chip-spatial
          path: '${{ runner.temp }}/chip-spatial-receipt.json'
          retention-days: 2
          if-no-files-found: error
      - name: Delete transient private sources
        if: always()
        shell: pwsh
        env:
          SOURCE_SHA: '${{ steps.request.outputs.source_sha }}'
          SOURCE_DIR: '${{ steps.source.outputs.source_dir }}'
        run: |
          if ($env:SOURCE_DIR -and (Test-Path -LiteralPath $env:SOURCE_DIR)) { Remove-Item -LiteralPath $env:SOURCE_DIR -Recurse -Force }
          if ($env:SOURCE_SHA -notmatch '^[0-9a-f]{40}$') { return }
          try {
            $oidc = Invoke-RestMethod -Method Get -Uri "$env:ACTIONS_ID_TOKEN_REQUEST_URL&audience=helix-runner-source-relay" -Headers @{Authorization="Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN"}
            $body = @{action='delete'; project_key='omniphony'; source_sha=$env:SOURCE_SHA} | ConvertTo-Json -Compress
            Invoke-RestMethod -Method Post -Uri 'https://fpzqpoaeaydcrlvbxgwo.supabase.co/functions/v1/github-compile-source' -Headers @{Authorization="Bearer $($oidc.value)"} -ContentType 'application/json' -Body $body | Out-Null
          } catch { Write-Warning "Transient source deletion failed: $($_.Exception.Message)" }
