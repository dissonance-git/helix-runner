name: windows-confinement-donor
# Second commit intentionally triggers the newly-installed workflow.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/windows-confinement-donor.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appcontainer-dacl:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Check out runner evidence surface
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true

      - name: Record Windows host
        shell: pwsh
        run: |
          [Environment]::OSVersion.Version
          (Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,BuildNumber) | Format-List
          whoami
          whoami /groups

      - name: Check out pinned MXC donor
        shell: pwsh
        run: |
          git clone --filter=blob:none https://github.com/microsoft/mxc.git mxc
          Set-Location mxc
          git checkout e8fa1f1d9bb1bbdf4cff8f341612f1ca7f320085
          if ((git rev-parse HEAD).Trim() -ne 'e8fa1f1d9bb1bbdf4cff8f341612f1ca7f320085') { throw 'MXC donor pin mismatch' }

      - name: Build only donor confinement executables
        shell: pwsh
        working-directory: mxc/src
        run: |
          rustc --version
          cargo --version
          cargo build --release --target x86_64-pc-windows-msvc -p wxc -p wxc_host_prep -p wxc_ui_probe

      - name: Prepare reversible AppContainer host prerequisites
        shell: pwsh
        working-directory: mxc
        run: |
          $Bin = Join-Path $PWD 'src\target\x86_64-pc-windows-msvc\release'
          & (Join-Path $Bin 'wxc-host-prep.exe') prepare-system-drive
          if ($LASTEXITCODE -ne 0) { throw "prepare-system-drive failed: $LASTEXITCODE" }
          & (Join-Path $Bin 'wxc-host-prep.exe') prepare-null-device --no-sacl --json
          if ($LASTEXITCODE -ne 0) { throw "prepare-null-device failed: $LASTEXITCODE" }

      - name: Prove Tier 3 filesystem and network boundary
        id: witness
        continue-on-error: true
        shell: pwsh
        working-directory: mxc
        run: |
          $Bin = Join-Path $PWD 'src\target\x86_64-pc-windows-msvc\release'
          $Wxc = Join-Path $Bin 'wxc-exec.exe'
          $Probe = Join-Path $Bin 'wxc-ui-probe.exe'
          $ProbeJson = Join-Path $env:RUNNER_TEMP 'mxc-probe.txt'
          $ResultsJson = Join-Path $env:RUNNER_TEMP 'mxc-tier3-results.json'

          & $Wxc --probe 2>&1 | Tee-Object -FilePath $ProbeJson
          if ($LASTEXITCODE -ne 0) { throw "wxc-exec --probe failed: $LASTEXITCODE" }

          & .\tests\scripts\run_processcontainer_all_tests.ps1 `
            -SkipBuild `
            -RequireTier appcontainer-dacl `
            -WxcDebug $Wxc `
            -WxcRelease $Wxc `
            -UiProbeDebug $Probe `
            -UiProbeRelease $Probe `
            -ResultsJson $ResultsJson `
            -Areas Probes,T3Forced,NetworkCapabilityMatrix
          if ($LASTEXITCODE -ne 0) { throw "MXC Tier-3 witness failed: $LASTEXITCODE" }

      - name: Revert persistent system-drive preparation
        if: always()
        shell: pwsh
        working-directory: mxc
        run: |
          $Prep = Join-Path $PWD 'src\target\x86_64-pc-windows-msvc\release\wxc-host-prep.exe'
          if (Test-Path $Prep) {
            & $Prep unprepare-system-drive
            if ($LASTEXITCODE -ne 0) { Write-Warning "unprepare-system-drive failed: $LASTEXITCODE" }
          }

      - name: Publish exact donor evidence
        if: always()
        shell: pwsh
        run: |
          git pull --ff-only origin main

          $Os = Get-CimInstance Win32_OperatingSystem
          $ProbePath = Join-Path $env:RUNNER_TEMP 'mxc-probe.txt'
          $ResultsPath = Join-Path $env:RUNNER_TEMP 'mxc-tier3-results.json'
          $ProbeText = if (Test-Path $ProbePath) { Get-Content -LiteralPath $ProbePath -Raw } else { $null }
          $Results = if (Test-Path $ResultsPath) {
            try { Get-Content -LiteralPath $ResultsPath -Raw | ConvertFrom-Json }
            catch { [ordered]@{ parse_error = $_.Exception.Message; raw = (Get-Content -LiteralPath $ResultsPath -Raw) } }
          } else { $null }

          $Evidence = [ordered]@{
            schema = 'helix-windows-confinement-donor-v1'
            donor = 'microsoft/mxc'
            donor_sha = 'e8fa1f1d9bb1bbdf4cff8f341612f1ca7f320085'
            runner_sha = $env:GITHUB_SHA
            run_id = $env:GITHUB_RUN_ID
            windows = [ordered]@{
              caption = $Os.Caption
              version = $Os.Version
              build = $Os.BuildNumber
            }
            expected_tier = 'appcontainer-dacl'
            witness_outcome = '${{ steps.witness.outcome }}'
            probe = $ProbeText
            results = $Results
          }

          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          $Evidence | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath evidence/windows-confinement-donor.json -Encoding UTF8

          git config user.name 'helix-runner'
          git config user.email 'helix-runner@users.noreply.github.com'
          git add evidence/windows-confinement-donor.json
          git commit -m "record Windows confinement donor evidence"
          git push origin HEAD:main

          if ('${{ steps.witness.outcome }}' -ne 'success') {
            throw 'Windows confinement donor witness did not pass.'
          }
