name: workspace

on:
  push:
    branches: [main]
    paths:
      - "workspace-request.json"
  workflow_dispatch:
    inputs:
      job_id:
        description: Exact Helix workspace job UUID
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: helix-workspace-${{ github.event.inputs.job_id || github.sha }}
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out runner control surface
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Provision pinned .NET 11 RC1 SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '11.0.100-rc.1.26425.128'

      - name: Record pinned .NET SDK identity
        run: |
          which dotnet
          dotnet --version
          dotnet --list-sdks

      - name: Provision pinned pytest
        run: |
          python3 -m pip install --disable-pip-version-check --no-input pytest==8.4.2
          python3 -m pytest --version

      - name: Execute exact Helix workspace job
        env:
          HELIX_JOB_ID: ${{ github.event.inputs.job_id || '' }}
        run: python3 workspace.py "$HELIX_JOB_ID"
