name: workspace

on:
  push:
    branches: [main]
    paths:
      - "workspace-request.json"
  workflow_dispatch:
    inputs:
      source_sha:
        description: Canonical Helix GitLab commit SHA
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: helix-hosted-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Read runner control surface
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve canonical Helix source SHA
        id: request
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SOURCE_SHA="${{ inputs.source_sha }}"
          else
            SCHEMA="$(python3 -c 'import json; print(json.load(open("workspace-request.json"))["schema"])')"
            if [ "$SCHEMA" != "helix-github-build-request/1" ]; then
              echo "Unsupported request schema: $SCHEMA" >&2
              exit 1
            fi
            SOURCE_SHA="$(python3 -c 'import json; print(json.load(open("workspace-request.json"))["source_sha"])')"
          fi

          if ! [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Invalid Helix source SHA: $SOURCE_SHA" >&2
            exit 1
          fi

          SOURCE_SHA="${SOURCE_SHA,,}"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Claim bounded private Helix source snapshot
        id: source
        shell: pwsh
        env:
          SOURCE_SHA: "${{ steps.request.outputs.source_sha }}"
        run: |
          $Audience = 'helix-runner-source-relay'
          $OidcUrl = "$env:ACTIONS_ID_TOKEN_REQUEST_URL&audience=$Audience"
          $Oidc = Invoke-RestMethod -Method Get -Uri $OidcUrl -Headers @{
            Authorization = "Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          }
          if ([string]::IsNullOrWhiteSpace([string]$Oidc.value)) {
            throw 'GitHub OIDC token request returned no token.'
          }

          $Relay = 'https://fpzqpoaeaydcrlvbxgwo.supabase.co/functions/v1/github-compile-source'
          $Body = @{
            action = 'read'
            project_key = 'helix'
            source_sha = $env:SOURCE_SHA
          } | ConvertTo-Json -Compress
          $Snapshot = Invoke-RestMethod -Method Post -Uri $Relay -Headers @{
            Authorization = "Bearer $($Oidc.value)"
          } -ContentType 'application/json' -Body $Body

          if ([string]$Snapshot.schema -ne 'helix/github-compile-source/2') {
            throw "Unexpected source relay schema: $($Snapshot.schema)"
          }
          if ([string]$Snapshot.project_key -ne 'helix') {
            throw "Source relay project mismatch: $($Snapshot.project_key)"
          }
          if ([string]$Snapshot.source_sha -ne $env:SOURCE_SHA) {
            throw "Source relay SHA mismatch: $($Snapshot.source_sha)"
          }

          $Root = Join-Path $env:RUNNER_TEMP 'helix-source'
          if (Test-Path -LiteralPath $Root) {
            Remove-Item -LiteralPath $Root -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $Root | Out-Null

          foreach ($File in @($Snapshot.files)) {
            $Relative = [string]$File.path
            if ([string]::IsNullOrWhiteSpace($Relative) -or
                [IO.Path]::IsPathRooted($Relative) -or
                $Relative.Contains('..')) {
              throw "Unsafe source relay path: $Relative"
            }

            $Target = Join-Path $Root $Relative
            $Parent = Split-Path -Parent $Target
            if (-not [string]::IsNullOrWhiteSpace($Parent)) {
              New-Item -ItemType Directory -Force -Path $Parent | Out-Null
            }

            [IO.File]::WriteAllBytes(
              $Target,
              [Convert]::FromBase64String([string]$File.content_b64)
            )
            $Actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $Target).Hash.ToLowerInvariant()
            if ($Actual -ne [string]$File.sha256) {
              throw "Source relay hash mismatch for $Relative"
            }
          }

          "source_dir=$Root" >> $env:GITHUB_OUTPUT
          Write-Host "HELIX_SOURCE_RELAY_OK sha=$env:SOURCE_SHA files=$(@($Snapshot.files).Count)"

      - name: Provision source-pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: "${{ steps.source.outputs.source_dir }}/global.json"

      - name: Build Helix solution
        shell: bash
        working-directory: "${{ steps.source.outputs.source_dir }}"
        run: |
          set -euo pipefail
          dotnet build Helix.slnx --nologo
          echo "HELIX_GITHUB_BUILD_OK sha=${{ steps.request.outputs.source_sha }}"

      - name: Run canonical Helix self-test
        shell: bash
        working-directory: "${{ steps.source.outputs.source_dir }}"
        run: |
          set -euo pipefail
          dotnet run --project operators/service/Helix.Service.csproj -- self-test
          echo "HELIX_GITHUB_SELF_TEST_OK sha=${{ steps.request.outputs.source_sha }}"

      - name: Write hosted verification receipt
        shell: pwsh
        env:
          SOURCE_SHA: "${{ steps.request.outputs.source_sha }}"
        run: |
          $Receipt = @{
            schema = 'helix/github-hosted-verification/1'
            source_sha = $env:SOURCE_SHA
            runner = 'github-hosted/ubuntu-24.04'
            solution_build = 'passed'
            service_self_test = 'passed'
            completed_at_utc = [DateTimeOffset]::UtcNow.ToString('O')
          }
          $Path = Join-Path $env:RUNNER_TEMP 'helix-hosted-verification.json'
          $Receipt | ConvertTo-Json | Set-Content -LiteralPath $Path -Encoding UTF8

      - name: Upload hosted verification receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "helix-hosted-verification"
          path: "${{ runner.temp }}/helix-hosted-verification.json"
          if-no-files-found: error
          retention-days: 1

      - name: Delete staged private Helix snapshot
        if: success()
        shell: pwsh
        env:
          SOURCE_SHA: "${{ steps.request.outputs.source_sha }}"
          SOURCE_DIR: "${{ steps.source.outputs.source_dir }}"
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:SOURCE_DIR) -and
              (Test-Path -LiteralPath $env:SOURCE_DIR)) {
            Remove-Item -LiteralPath $env:SOURCE_DIR -Recurse -Force
          }

          $Audience = 'helix-runner-source-relay'
          $OidcUrl = "$env:ACTIONS_ID_TOKEN_REQUEST_URL&audience=$Audience"
          $Oidc = Invoke-RestMethod -Method Get -Uri $OidcUrl -Headers @{
            Authorization = "Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          }
          $Relay = 'https://fpzqpoaeaydcrlvbxgwo.supabase.co/functions/v1/github-compile-source'
          $Body = @{
            action = 'delete'
            project_key = 'helix'
            source_sha = $env:SOURCE_SHA
          } | ConvertTo-Json -Compress
          Invoke-RestMethod -Method Post -Uri $Relay -Headers @{
            Authorization = "Bearer $($Oidc.value)"
          } -ContentType 'application/json' -Body $Body | Out-Null
