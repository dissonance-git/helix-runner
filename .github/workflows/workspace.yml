name: workspace

on:
  push:
    branches: [main]
    paths:
      - "workspace-request.json"
  workflow_dispatch:
    inputs:
      job_id:
        description: Exact Helix workspace job UUID
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: helix-workspace-${{ github.event.inputs.job_id || github.sha }}
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out runner control surface
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Execute exact Helix workspace job
        env:
          HELIX_JOB_ID: ${{ github.event.inputs.job_id || '' }}
        run: python3 workspace.py "$HELIX_JOB_ID"
