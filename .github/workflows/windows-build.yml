name: windows-build

on:
  push:
    branches: [main]
    paths:
      - request.json
  workflow_dispatch:
    inputs:
      source_sha:
        description: Canonical Omniphony GitLab commit SHA
        required: true
        type: string
      publish_release:
        description: Promote the verified installer to a permanent GitHub Release
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: omniphony-windows-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    outputs:
      source_sha: "${{ steps.source.outputs.source_sha }}"
      short_sha: "${{ steps.source.outputs.short_sha }}"

    steps:
      - name: Read runner request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve canonical source SHA
        id: request
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $SourceSha = "${{ inputs.source_sha }}"
          } else {
            $Request = Get-Content -LiteralPath request.json -Raw -Encoding UTF8 | ConvertFrom-Json
            if ([string]$Request.schema -ne 'omniphony-github-build-request/1') {
              throw "Unsupported request schema: $($Request.schema)"
            }
            $SourceSha = [string]$Request.source_sha
          }

          if ($SourceSha -notmatch '^[0-9a-fA-F]{40}$') {
            throw "Invalid Omniphony source SHA: $SourceSha"
          }

          "source_sha=$($SourceSha.ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Fetch exact private Omniphony source from GitLab
        id: source
        shell: pwsh
        env:
          SOURCE_SHA: "${{ steps.request.outputs.source_sha }}"
          OMNIPHONY_GITLAB_TOKEN: "${{ secrets.OMNIPHONY_GITLAB_TOKEN }}"
          GITLAB_READ_TOKEN: "${{ secrets.GITLAB_READ_TOKEN }}"
          GITLAB_TOKEN: "${{ secrets.GITLAB_TOKEN }}"
        run: |
          $Token = @(
            $env:OMNIPHONY_GITLAB_TOKEN,
            $env:GITLAB_READ_TOKEN,
            $env:GITLAB_TOKEN
          ) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Select-Object -First 1

          if ([string]::IsNullOrWhiteSpace($Token)) {
            throw 'No GitLab read token is configured in GitHub Actions. Configure one of OMNIPHONY_GITLAB_TOKEN, GITLAB_READ_TOKEN, or GITLAB_TOKEN with read_repository access.'
          }

          $Root = Join-Path $env:RUNNER_TEMP 'omniphony-source'
          if (Test-Path -LiteralPath $Root) {
            Remove-Item -LiteralPath $Root -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $Root | Out-Null

          $Basic = [Convert]::ToBase64String(
            [Text.Encoding]::ASCII.GetBytes("oauth2:$Token")
          )
          $env:GIT_CONFIG_COUNT = '1'
          $env:GIT_CONFIG_KEY_0 = 'http.extraHeader'
          $env:GIT_CONFIG_VALUE_0 = "Authorization: Basic $Basic"

          git -C $Root init .
          if ($LASTEXITCODE -ne 0) { throw "git init failed: $LASTEXITCODE" }
          git -C $Root remote add origin https://gitlab.com/dissonance-git/omniphony.git
          if ($LASTEXITCODE -ne 0) { throw "git remote add failed: $LASTEXITCODE" }
          git -C $Root fetch --no-tags --depth 1 origin $env:SOURCE_SHA
          if ($LASTEXITCODE -ne 0) { throw "git fetch failed: $LASTEXITCODE" }
          git -C $Root checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw "git checkout failed: $LASTEXITCODE" }

          Remove-Item Env:GIT_CONFIG_COUNT -ErrorAction SilentlyContinue
          Remove-Item Env:GIT_CONFIG_KEY_0 -ErrorAction SilentlyContinue
          Remove-Item Env:GIT_CONFIG_VALUE_0 -ErrorAction SilentlyContinue

          $ActualSha = (git -C $Root rev-parse HEAD).Trim().ToLowerInvariant()
          if ($ActualSha -ne $env:SOURCE_SHA.ToLowerInvariant()) {
            throw "Fetched source SHA mismatch: expected $env:SOURCE_SHA got $ActualSha"
          }

          $ShortSha = $ActualSha.Substring(0, 8)
          "source_dir=$Root" >> $env:GITHUB_OUTPUT
          "artifact=$Root\dist\OmniphonySetup.exe" >> $env:GITHUB_OUTPUT
          "source_sha=$ActualSha" >> $env:GITHUB_OUTPUT
          "short_sha=$ShortSha" >> $env:GITHUB_OUTPUT

      - name: Provision source-pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: "${{ steps.source.outputs.source_dir }}/global.json"

      - name: Build Omniphony Windows product
        shell: pwsh
        working-directory: "${{ steps.source.outputs.source_dir }}"
        env:
          OMNIPHONY_SOURCE_SHA: "${{ steps.source.outputs.source_sha }}"
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File ci/windows-product.ps1

      - name: Verify product artifact
        shell: pwsh
        env:
          ARTIFACT: "${{ steps.source.outputs.artifact }}"
        run: |
          if (-not (Test-Path -LiteralPath $env:ARTIFACT -PathType Leaf)) {
            throw "Expected artifact missing: $env:ARTIFACT"
          }
          $Hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $env:ARTIFACT).Hash.ToLowerInvariant()
          $Bytes = (Get-Item -LiteralPath $env:ARTIFACT).Length
          if ($Bytes -gt 209715200) {
            throw "Artifact exceeds 200 MiB storage guard: $Bytes bytes"
          }
          Write-Host "OMNIPHONY_GITHUB_WINDOWS_BUILD_OK bytes=$Bytes sha256=$Hash"

      - name: Attest Windows product provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "${{ steps.source.outputs.artifact }}"

      - name: Upload Windows product
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "omniphony-${{ steps.source.outputs.short_sha }}"
          path: "${{ steps.source.outputs.artifact }}"
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Remove private source
        if: always()
        shell: pwsh
        env:
          SOURCE_DIR: "${{ steps.source.outputs.source_dir }}"
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:SOURCE_DIR) -and
              (Test-Path -LiteralPath $env:SOURCE_DIR)) {
            Remove-Item -LiteralPath $env:SOURCE_DIR -Recurse -Force
          }

  release:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: read
      contents: write
    env:
      GH_TOKEN: "${{ github.token }}"
      SOURCE_SHA: "${{ needs.build.outputs.source_sha }}"
      SHORT_SHA: "${{ needs.build.outputs.short_sha }}"
    steps:
      - name: Download verified installer
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "omniphony-$SHORT_SHA"

      - name: Verify provenance before promotion
        run: |
          test -f OmniphonySetup.exe
          gh attestation verify OmniphonySetup.exe --repo "$GITHUB_REPOSITORY"
          sha256sum OmniphonySetup.exe > OmniphonySetup.exe.sha256

      - name: Publish immutable source-addressed release
        run: |
          TAG="omniphony-$SOURCE_SHA"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to mutate it."
            exit 1
          fi
          gh release create "$TAG" OmniphonySetup.exe \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Omniphony $SHORT_SHA" \
            --notes "Verified Windows installer built on GitHub-hosted windows-2025 from canonical private GitLab Omniphony source $SOURCE_SHA."
