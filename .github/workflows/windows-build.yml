name: windows-build

on:
  push:
    branches: [main]
    paths:
      - request.json
  workflow_dispatch:
    inputs:
      source_sha:
        description: Canonical Omniphony GitLab commit SHA
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: omniphony-windows-build
  cancel-in-progress: true

jobs:
  compile:
    runs-on: windows-2025
    timeout-minutes: 60

    steps:
      - name: Read runner request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve canonical source SHA
        id: request
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $SourceSha = "${{ inputs.source_sha }}"
          } else {
            $Request = Get-Content -LiteralPath request.json -Raw -Encoding UTF8 | ConvertFrom-Json
            if ([string]$Request.schema -ne 'omniphony-github-build-request/1') {
              throw "Unsupported request schema: $($Request.schema)"
            }
            $SourceSha = [string]$Request.source_sha
          }

          if ($SourceSha -notmatch '^[0-9a-fA-F]{40}$') {
            throw "Invalid Omniphony source SHA: $SourceSha"
          }

          "source_sha=$($SourceSha.ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Claim bounded private compile snapshot
        id: source
        shell: pwsh
        env:
          SOURCE_SHA: "${{ steps.request.outputs.source_sha }}"
        run: |
          $Audience = 'helix-runner-source-relay'
          $OidcUrl = "$env:ACTIONS_ID_TOKEN_REQUEST_URL&audience=$Audience"
          $Oidc = Invoke-RestMethod -Method Get -Uri $OidcUrl -Headers @{
            Authorization = "Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          }
          if ([string]::IsNullOrWhiteSpace([string]$Oidc.value)) {
            throw 'GitHub OIDC token request returned no token.'
          }

          $Relay = 'https://fpzqpoaeaydcrlvbxgwo.supabase.co/functions/v1/github-compile-source'
          $Body = @{
            action = 'read'
            project_key = 'omniphony'
            source_sha = $env:SOURCE_SHA
          } | ConvertTo-Json -Compress
          $Snapshot = Invoke-RestMethod -Method Post -Uri $Relay -Headers @{
            Authorization = "Bearer $($Oidc.value)"
          } -ContentType 'application/json' -Body $Body

          if ([string]$Snapshot.schema -ne 'helix/github-compile-source/2') {
            throw "Unexpected source relay schema: $($Snapshot.schema)"
          }
          if ([string]$Snapshot.project_key -ne 'omniphony') {
            throw "Source relay project mismatch: $($Snapshot.project_key)"
          }
          if ([string]$Snapshot.source_sha -ne $env:SOURCE_SHA) {
            throw "Source relay SHA mismatch: $($Snapshot.source_sha)"
          }
          if (@($Snapshot.files).Count -lt 1) {
            throw 'Source relay returned no files.'
          }

          $Root = Join-Path $env:RUNNER_TEMP 'omniphony-source'
          if (Test-Path -LiteralPath $Root) {
            Remove-Item -LiteralPath $Root -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $Root | Out-Null

          foreach ($File in @($Snapshot.files)) {
            $Relative = [string]$File.path
            if ([string]::IsNullOrWhiteSpace($Relative) -or
                [IO.Path]::IsPathRooted($Relative) -or
                $Relative.Contains('..')) {
              throw "Unsafe source relay path: $Relative"
            }

            $Target = Join-Path $Root $Relative
            $Parent = Split-Path -Parent $Target
            if (-not [string]::IsNullOrWhiteSpace($Parent)) {
              New-Item -ItemType Directory -Force -Path $Parent | Out-Null
            }

            [IO.File]::WriteAllBytes(
              $Target,
              [Convert]::FromBase64String([string]$File.content_b64)
            )
            $Actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $Target).Hash.ToLowerInvariant()
            if ($Actual -ne [string]$File.sha256) {
              throw "Source relay hash mismatch for $Relative"
            }
          }

          # Reassemble explicitly chunked large private source files after every
          # individual relay row has passed its own SHA-256 check.
          $ChunkRoot = Join-Path $Root '.relay-chunks'
          if (Test-Path -LiteralPath $ChunkRoot -PathType Container) {
            $Manifests = @(Get-ChildItem -LiteralPath $ChunkRoot -Recurse -File -Filter 'manifest.json')
            foreach ($ManifestFile in $Manifests) {
              $Manifest = Get-Content -LiteralPath $ManifestFile.FullName -Raw -Encoding UTF8 | ConvertFrom-Json
              if ([string]$Manifest.schema -ne 'helix/relay-chunk-manifest/1') {
                throw "Unsupported relay chunk manifest: $($ManifestFile.FullName)"
              }

              $TargetRelative = [string]$Manifest.target_path
              if ([string]::IsNullOrWhiteSpace($TargetRelative) -or
                  [IO.Path]::IsPathRooted($TargetRelative) -or
                  $TargetRelative.Contains('..') -or
                  $TargetRelative.StartsWith('.relay-chunks', [StringComparison]::OrdinalIgnoreCase)) {
                throw "Unsafe relay chunk target: $TargetRelative"
              }

              $BundleDir = $ManifestFile.DirectoryName
              $Parts = @(Get-ChildItem -LiteralPath $BundleDir -File -Filter '*.part' | Sort-Object Name)
              if ($Parts.Count -ne [int]$Manifest.parts) {
                throw "Relay chunk count mismatch for $TargetRelative"
              }

              $Target = Join-Path $Root $TargetRelative
              $Parent = Split-Path -Parent $Target
              if (-not [string]::IsNullOrWhiteSpace($Parent)) {
                New-Item -ItemType Directory -Force -Path $Parent | Out-Null
              }

              $Output = [IO.File]::Open($Target, [IO.FileMode]::Create, [IO.FileAccess]::Write, [IO.FileShare]::None)
              try {
                foreach ($Part in $Parts) {
                  $Input = [IO.File]::OpenRead($Part.FullName)
                  try {
                    $Input.CopyTo($Output)
                  }
                  finally {
                    $Input.Dispose()
                  }
                }
              }
              finally {
                $Output.Dispose()
              }

              $Actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $Target).Hash.ToLowerInvariant()
              if ($Actual -ne [string]$Manifest.sha256) {
                throw "Reassembled relay hash mismatch for $TargetRelative"
              }
              if ((Get-Item -LiteralPath $Target).Length -ne [int64]$Manifest.bytes) {
                throw "Reassembled relay byte-count mismatch for $TargetRelative"
              }
              Write-Host "OMNIPHONY_SOURCE_RELAY_REASSEMBLED path=$TargetRelative parts=$($Parts.Count) sha256=$Actual"
            }
            Remove-Item -LiteralPath $ChunkRoot -Recurse -Force
          }

          $ShortSha = $env:SOURCE_SHA.Substring(0, 8)
          "source_dir=$Root" >> $env:GITHUB_OUTPUT
          "short_sha=$ShortSha" >> $env:GITHUB_OUTPUT
          Write-Host "OMNIPHONY_SOURCE_RELAY_OK sha=$env:SOURCE_SHA files=$(@($Snapshot.files).Count)"

      - name: Provision source-pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: "${{ steps.source.outputs.source_dir }}/global.json"

      - name: Compile and prove NativeAOT Omniphony tooling
        shell: pwsh
        working-directory: "${{ steps.source.outputs.source_dir }}"
        run: |
          dotnet build tooling/Omniphony.Tooling.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "managed tooling build failed: $LASTEXITCODE" }

          dotnet publish tooling/Omniphony.Tooling.csproj -c Release -r win-x64 --self-contained true -p:PublishAot=true -o build/tooling-aot
          if ($LASTEXITCODE -ne 0) { throw "NativeAOT tooling publish failed: $LASTEXITCODE" }

          $Tool = Join-Path (Resolve-Path build/tooling-aot).Path 'Omniphony.Tooling.exe'
          if (-not (Test-Path -LiteralPath $Tool -PathType Leaf)) {
            throw "NativeAOT tooling executable missing: $Tool"
          }

          & $Tool self-test
          if ($LASTEXITCODE -ne 0) { throw "NativeAOT tooling self-test failed: $LASTEXITCODE" }

          & $Tool preflight
          if ($LASTEXITCODE -ne 0) { throw "NativeAOT tooling preflight failed: $LASTEXITCODE" }

          $Hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $Tool).Hash.ToLowerInvariant()
          $Bytes = (Get-Item -LiteralPath $Tool).Length
          Write-Host "OMNIPHONY_TOOLING_AOT_OK bytes=$Bytes sha256=$Hash"

      - name: Compile managed Windows setup
        shell: pwsh
        working-directory: "${{ steps.source.outputs.source_dir }}"
        run: |
          dotnet build windows/setup/Omniphony.Setup.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "managed setup build failed: $LASTEXITCODE" }

      - name: Publish NativeAOT Windows setup
        shell: pwsh
        working-directory: "${{ steps.source.outputs.source_dir }}"
        run: |
          dotnet publish windows/setup/Omniphony.Setup.csproj -c Release -r win-x64 --self-contained true -p:PublishAot=true -o build/setup-aot
          if ($LASTEXITCODE -ne 0) { throw "NativeAOT setup publish failed: $LASTEXITCODE" }
          $Exe = Join-Path (Resolve-Path build/setup-aot).Path 'Omniphony.Setup.exe'
          if (-not (Test-Path -LiteralPath $Exe -PathType Leaf)) {
            throw "NativeAOT setup executable missing: $Exe"
          }
          $Hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $Exe).Hash.ToLowerInvariant()
          $Bytes = (Get-Item -LiteralPath $Exe).Length
          Write-Host "OMNIPHONY_SETUP_AOT_OK bytes=$Bytes sha256=$Hash"

      - name: Configure native Windows APO build
        shell: pwsh
        working-directory: "${{ steps.source.outputs.source_dir }}"
        run: |
          cmake -S windows/apo -B build/windows-apo -A x64
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed: $LASTEXITCODE" }

      - name: Compile native Windows APO and helpers
        shell: pwsh
        working-directory: "${{ steps.source.outputs.source_dir }}"
        run: |
          cmake --build build/windows-apo --config Release -- /m
          if ($LASTEXITCODE -ne 0) { throw "native Windows build failed: $LASTEXITCODE" }

      - name: Build single-executable Windows product
        id: product
        shell: pwsh
        working-directory: "${{ steps.source.outputs.source_dir }}"
        run: |
          $Tool = (Resolve-Path 'build/tooling-aot/Omniphony.Tooling.exe').Path
          & $Tool windows-product --configuration Release
          if ($LASTEXITCODE -ne 0) { throw "managed Windows product build failed: $LASTEXITCODE" }

          $Product = (Resolve-Path 'dist/OmniphonySetup.exe').Path
          if (-not (Test-Path -LiteralPath $Product -PathType Leaf)) {
            throw "single-executable Windows product missing: $Product"
          }

          $Hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $Product).Hash.ToLowerInvariant()
          $Bytes = (Get-Item -LiteralPath $Product).Length
          "product=$Product" >> $env:GITHUB_OUTPUT
          "sha256=$Hash" >> $env:GITHUB_OUTPUT
          "bytes=$Bytes" >> $env:GITHUB_OUTPUT
          Write-Host "OMNIPHONY_WINDOWS_PRODUCT_ARTIFACT_OK bytes=$Bytes sha256=$Hash route=legacy-fallback"

      - name: Upload single-executable Windows product
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "OmniphonySetup-${{ steps.source.outputs.short_sha }}"
          path: "${{ steps.product.outputs.product }}"
          if-no-files-found: error
          retention-days: 7

      - name: Write compile receipt
        shell: pwsh
        env:
          SOURCE_SHA: "${{ steps.request.outputs.source_sha }}"
          SOURCE_DIR: "${{ steps.source.outputs.source_dir }}"
        run: |
          $Receipt = @{
            schema = 'omniphony/github-windows-compile/1'
            source_sha = $env:SOURCE_SHA
            runner = 'github-hosted/windows-2025'
            managed_setup = 'compiled'
            native_windows_apo = 'compiled'
            nativeaot_setup = 'published'
            windows_product = 'bundled'
            product_sha256 = '${{ steps.product.outputs.sha256 }}'
            product_bytes = '${{ steps.product.outputs.bytes }}'
            product_route = 'legacy-fallback'
            completed_at_utc = [DateTimeOffset]::UtcNow.ToString('O')
          }
          $Path = Join-Path $env:RUNNER_TEMP 'omniphony-compile-receipt.json'
          $Receipt | ConvertTo-Json | Set-Content -LiteralPath $Path -Encoding UTF8
          "receipt=$Path" >> $env:GITHUB_OUTPUT
          Write-Host "OMNIPHONY_GITHUB_COMPILE_OK sha=$env:SOURCE_SHA"

      - name: Upload compile receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "omniphony-compile-${{ steps.source.outputs.short_sha }}"
          path: "${{ runner.temp }}/omniphony-compile-receipt.json"
          if-no-files-found: error
          retention-days: 1

      - name: Delete staged private source snapshot
        if: always()
        shell: pwsh
        env:
          SOURCE_SHA: "${{ steps.request.outputs.source_sha }}"
          SOURCE_DIR: "${{ steps.source.outputs.source_dir }}"
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:SOURCE_DIR) -and
              (Test-Path -LiteralPath $env:SOURCE_DIR)) {
            Remove-Item -LiteralPath $env:SOURCE_DIR -Recurse -Force
          }

          try {
            $Audience = 'helix-runner-source-relay'
            $OidcUrl = "$env:ACTIONS_ID_TOKEN_REQUEST_URL&audience=$Audience"
            $Oidc = Invoke-RestMethod -Method Get -Uri $OidcUrl -Headers @{
              Authorization = "Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN"
            }
            $Relay = 'https://fpzqpoaeaydcrlvbxgwo.supabase.co/functions/v1/github-compile-source'
            $Body = @{
              action = 'delete'
              project_key = 'omniphony'
              source_sha = $env:SOURCE_SHA
            } | ConvertTo-Json -Compress
            Invoke-RestMethod -Method Post -Uri $Relay -Headers @{
              Authorization = "Bearer $($Oidc.value)"
            } -ContentType 'application/json' -Body $Body | Out-Null
          } catch {
            Write-Warning "Source relay cleanup failed: $($_.Exception.Message)"
          }
