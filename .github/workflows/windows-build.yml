name: windows-build

on:
  push:
    branches: [main]
    paths:
      - request.json
  workflow_dispatch:
    inputs:
      source_sha:
        description: Canonical Omniphony GitLab commit SHA
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: omniphony-windows-build
  cancel-in-progress: true

jobs:
  compile:
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Read runner request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve canonical source SHA
        id: request
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $SourceSha = "${{ inputs.source_sha }}"
          } else {
            $Request = Get-Content -LiteralPath request.json -Raw -Encoding UTF8 | ConvertFrom-Json
            if ([string]$Request.schema -ne 'omniphony-github-build-request/1') {
              throw "Unsupported request schema: $($Request.schema)"
            }
            $SourceSha = [string]$Request.source_sha
          }
          if ($SourceSha -notmatch '^[0-9a-fA-F]{40}$') {
            throw "Invalid Omniphony source SHA: $SourceSha"
          }
          "source_sha=$($SourceSha.ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Claim OIDC-scoped private compile snapshot
        id: source
        shell: pwsh
        env:
          SOURCE_SHA: "${{ steps.request.outputs.source_sha }}"
          SOURCE_RELAY_URL: https://fpzqpoaeaydcrlvbxgwo.supabase.co/functions/v1/omniphony-github-source
        run: |
          $Audience = [uri]::EscapeDataString('omniphony-supabase-compile')
          $OidcResponse = Invoke-RestMethod -Uri ($env:ACTIONS_ID_TOKEN_REQUEST_URL + '&audience=' + $Audience) -Headers @{ Authorization = 'Bearer ' + $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN }
          $Oidc = [string]$OidcResponse.value
          if ([string]::IsNullOrWhiteSpace($Oidc)) { throw 'GitHub OIDC token unavailable' }

          $Body = @{
            action = 'claim'
            source_sha = $env:SOURCE_SHA
          } | ConvertTo-Json -Compress
          $Response = Invoke-RestMethod -Method Post -Uri $env:SOURCE_RELAY_URL -Headers @{ Authorization = 'Bearer ' + $Oidc } -ContentType 'application/json' -Body $Body
          if (-not $Response.ok) { throw ([string]$Response.error) }
          if ([string]$Response.source_sha -ne $env:SOURCE_SHA) { throw 'Relay source SHA mismatch' }

          $Root = Join-Path $env:RUNNER_TEMP 'omniphony-compile'
          if (Test-Path -LiteralPath $Root) { Remove-Item -LiteralPath $Root -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $Root | Out-Null

          foreach ($File in $Response.files) {
            $Relative = [string]$File.path
            if ([string]::IsNullOrWhiteSpace($Relative) -or
                [IO.Path]::IsPathRooted($Relative) -or
                $Relative.Contains('..')) {
              throw "Relay returned unsafe path: $Relative"
            }

            $Path = Join-Path $Root $Relative
            $Parent = Split-Path -Parent $Path
            if ($Parent) { New-Item -ItemType Directory -Force -Path $Parent | Out-Null }
            $Bytes = [Convert]::FromBase64String([string]$File.content_b64)
            [IO.File]::WriteAllBytes($Path, $Bytes)

            $Hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $Path).Hash.ToLowerInvariant()
            if ($Hash -ne ([string]$File.sha256).ToLowerInvariant()) {
              throw "Relay file checksum mismatch: $Relative"
            }
          }

          $Count = @($Response.files).Count
          if ($Count -ne 44) { throw "Unexpected compile snapshot file count: $Count" }
          "source_dir=$Root" >> $env:GITHUB_OUTPUT
          Write-Host "OMNIPHONY_PRIVATE_COMPILE_SNAPSHOT_OK files=$Count sha=$env:SOURCE_SHA"

      - name: Provision source-pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: "${{ steps.source.outputs.source_dir }}/global.json"

      - name: Compile managed Windows setup
        shell: pwsh
        working-directory: "${{ steps.source.outputs.source_dir }}"
        run: |
          dotnet build omniphony-renderer/windows_installer/Omniphony.Setup.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "Managed Setup compile failed: $LASTEXITCODE" }

      - name: Configure native APO build
        shell: pwsh
        working-directory: "${{ steps.source.outputs.source_dir }}"
        run: |
          cmake -S omniphony-renderer/windows_installer/endpoint_apo -B build/endpoint_apo -A x64
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed: $LASTEXITCODE" }

      - name: Compile native APO and Windows helpers
        shell: pwsh
        working-directory: "${{ steps.source.outputs.source_dir }}"
        run: |
          cmake --build build/endpoint_apo --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "Native Windows compile failed: $LASTEXITCODE" }
          Write-Host "OMNIPHONY_GITHUB_WINDOWS_COMPILE_OK sha=${{ steps.request.outputs.source_sha }}"

      - name: Complete source relay
        if: always()
        shell: pwsh
        env:
          SOURCE_SHA: "${{ steps.request.outputs.source_sha }}"
          SOURCE_RELAY_URL: https://fpzqpoaeaydcrlvbxgwo.supabase.co/functions/v1/omniphony-github-source
          JOB_STATUS: "${{ job.status }}"
        run: |
          try {
            $Audience = [uri]::EscapeDataString('omniphony-supabase-compile')
            $OidcResponse = Invoke-RestMethod -Uri ($env:ACTIONS_ID_TOKEN_REQUEST_URL + '&audience=' + $Audience) -Headers @{ Authorization = 'Bearer ' + $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN }
            $Body = @{
              action = 'complete'
              source_sha = $env:SOURCE_SHA
              success = ($env:JOB_STATUS -eq 'success')
            } | ConvertTo-Json -Compress
            Invoke-RestMethod -Method Post -Uri $env:SOURCE_RELAY_URL -Headers @{ Authorization = 'Bearer ' + [string]$OidcResponse.value } -ContentType 'application/json' -Body $Body | Out-Null
          } catch {
            Write-Warning "Compile-source relay completion failed: $($_.Exception.Message)"
          }

      - name: Remove private source
        if: always()
        shell: pwsh
        env:
          SOURCE_DIR: "${{ steps.source.outputs.source_dir }}"
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:SOURCE_DIR) -and
              (Test-Path -LiteralPath $env:SOURCE_DIR)) {
            Remove-Item -LiteralPath $env:SOURCE_DIR -Recurse -Force
          }
