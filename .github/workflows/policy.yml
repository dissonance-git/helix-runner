name: policy

on:
  push:
    branches: [main]
    paths:
      - ".github/**"
      - "AGENTS.md"
      - "README.md"
  pull_request:
    paths:
      - ".github/**"
      - "AGENTS.md"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: helix-runner-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read policy surface
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enforce runner policy
        run: python .github/policy.py
