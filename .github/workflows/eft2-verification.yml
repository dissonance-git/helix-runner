name: eft2-verification

on:
  push:
    branches: [main]
    paths:
      - eft2-request.json
  workflow_dispatch:
    inputs:
      build_id:
        description: Staged Helix EFT2 verification UUID
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: helix-eft2-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Read verification request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve build id
        id: request
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $BuildId = "${{ inputs.build_id }}"
          } else {
            $Request = Get-Content -LiteralPath eft2-request.json -Raw -Encoding UTF8 | ConvertFrom-Json
            $BuildId = [string]$Request.build_id
          }
          if ($BuildId -notmatch '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$') {
            throw "Invalid staged build id: $BuildId"
          }
          "build_id=$BuildId" >> $env:GITHUB_OUTPUT

      - name: Claim exact EFT2 source bundle
        id: source
        shell: pwsh
        env:
          BUILD_ID: "${{ steps.request.outputs.build_id }}"
          HELIX_BUILD_URL: https://fpzqpoaeaydcrlvbxgwo.supabase.co/functions/v1/helix-build
        run: |
          $Audience = [uri]::EscapeDataString('helix-supabase-build')
          $OidcResponse = Invoke-RestMethod -Uri ($env:ACTIONS_ID_TOKEN_REQUEST_URL + '&audience=' + $Audience) -Headers @{ Authorization = 'Bearer ' + $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN }
          $Oidc = [string]$OidcResponse.value
          if ([string]::IsNullOrWhiteSpace($Oidc)) { throw 'GitHub OIDC token unavailable' }

          $Body = @{
            action = 'claim'
            build_id = $env:BUILD_ID
            oidc_token = $Oidc
          } | ConvertTo-Json -Compress
          $Response = Invoke-RestMethod -Method Post -Uri $env:HELIX_BUILD_URL -ContentType 'application/json' -Body $Body
          if (-not $Response.ok) { throw ([string]$Response.error) }

          $Build = $Response.build
          if ([string]$Build.repo -ne 'eft2') { throw 'Build repository rejected' }
          if ([string]$Build.route -ne 'verification-reference') { throw 'Build route rejected' }
          if ([string]$Build.artifact -ne 'dist/EFT2Verification.zip') { throw 'Artifact contract rejected' }

          $Root = Join-Path $env:RUNNER_TEMP 'helix-eft2-verification'
          $Parts = Join-Path $Root 'parts'
          if (Test-Path -LiteralPath $Root) { Remove-Item -LiteralPath $Root -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $Parts | Out-Null
          $Bundle = Join-Path $Root 'source.tar.gz'
          $Output = [System.IO.File]::Open($Bundle, [System.IO.FileMode]::Create)
          try {
            foreach ($Chunk in ($Build.chunks | Sort-Object index)) {
              $Part = Join-Path $Parts ('part-{0:D5}.bin' -f [int]$Chunk.index)
              Invoke-WebRequest -Uri ([string]$Chunk.signed_url) -OutFile $Part
              $Hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $Part).Hash.ToLowerInvariant()
              if ($Hash -ne ([string]$Chunk.sha256).ToLowerInvariant()) {
                throw "Chunk checksum mismatch at index $($Chunk.index)"
              }
              $Bytes = [System.IO.File]::ReadAllBytes($Part)
              $Output.Write($Bytes, 0, $Bytes.Length)
            }
          } finally {
            $Output.Dispose()
          }

          $BundleHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $Bundle).Hash.ToLowerInvariant()
          if ($BundleHash -ne ([string]$Build.sha256).ToLowerInvariant()) {
            throw 'Source bundle checksum mismatch'
          }
          Remove-Item -LiteralPath $Parts -Recurse -Force

          tar -xzf $Bundle -C $Root
          if ($LASTEXITCODE -ne 0) { throw "Source extraction failed: $LASTEXITCODE" }

          $Manifest = Get-Content -LiteralPath (Join-Path $Root '.helix-build.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          $ManifestRoute = [string]$Manifest.route
          $AcceptedManifestRoutes = @('verification-reference', 'verification-training')
          if ([string]$Manifest.repo -ne 'eft2' -or $ManifestRoute -notin $AcceptedManifestRoutes) {
            throw 'Extracted build manifest rejected'
          }
          if ($ManifestRoute -eq 'verification-training') {
            Write-Host 'Accepted revision-pinned legacy staging manifest as verification-reference'
          }
          if ([string]$Manifest.base_sha -ne [string]$Build.base_sha) {
            throw 'Build manifest base SHA mismatch'
          }

          $Source = Join-Path $Root 'source'
          $Artifact = Join-Path $Source 'dist\EFT2Verification.zip'
          $ShortSha = ([string]$Build.base_sha).Substring(0, 8)
          "source_dir=$Source" >> $env:GITHUB_OUTPUT
          "artifact=$Artifact" >> $env:GITHUB_OUTPUT
          "short_sha=$ShortSha" >> $env:GITHUB_OUTPUT
          "base_sha=$([string]$Build.base_sha)" >> $env:GITHUB_OUTPUT

      - name: Run strongest free-hosted EFT2 verification
        shell: pwsh
        working-directory: "${{ steps.source.outputs.source_dir }}"
        run: |
          $Output = Join-Path (Get-Location) 'dist\verification'
          New-Item -ItemType Directory -Force -Path $Output | Out-Null
          & pwsh -NoProfile -ExecutionPolicy Bypass -File tools/run-verification.ps1 reference -OutputDir $Output
          if ($LASTEXITCODE -ne 0) {
            throw "EFT2 reference verification failed: $LASTEXITCODE"
          }

          $Artifact = Join-Path (Get-Location) 'dist\EFT2Verification.zip'
          if (Test-Path -LiteralPath $Artifact) { Remove-Item -LiteralPath $Artifact -Force }
          Compress-Archive -Path (Join-Path $Output '*') -DestinationPath $Artifact -CompressionLevel Optimal

      - name: Verify evidence artifact
        shell: pwsh
        env:
          ARTIFACT: "${{ steps.source.outputs.artifact }}"
        run: |
          if (-not (Test-Path -LiteralPath $env:ARTIFACT -PathType Leaf)) {
            throw "Expected artifact missing: $env:ARTIFACT"
          }
          $Hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $env:ARTIFACT).Hash.ToLowerInvariant()
          $Bytes = (Get-Item -LiteralPath $env:ARTIFACT).Length
          if ($Bytes -gt 209715200) { throw "Artifact exceeds 200 MiB storage guard: $Bytes bytes" }
          Write-Host "HELIX_EFT2_VERIFICATION_OK bytes=$Bytes sha256=$Hash"

      - name: Attest EFT2 verification provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "${{ steps.source.outputs.artifact }}"

      - name: Upload EFT2 verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "eft2-verification-${{ steps.source.outputs.short_sha }}"
          path: "${{ steps.source.outputs.artifact }}"
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Remove staged source
        if: always() && steps.request.outputs.build_id != ''
        shell: pwsh
        env:
          BUILD_ID: "${{ steps.request.outputs.build_id }}"
          HELIX_BUILD_URL: https://fpzqpoaeaydcrlvbxgwo.supabase.co/functions/v1/helix-build
        run: |
          try {
            $Audience = [uri]::EscapeDataString('helix-supabase-build')
            $OidcResponse = Invoke-RestMethod -Uri ($env:ACTIONS_ID_TOKEN_REQUEST_URL + '&audience=' + $Audience) -Headers @{ Authorization = 'Bearer ' + $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN }
            $Body = @{
              action = 'complete'
              build_id = $env:BUILD_ID
              oidc_token = [string]$OidcResponse.value
            } | ConvertTo-Json -Compress
            Invoke-RestMethod -Method Post -Uri $env:HELIX_BUILD_URL -ContentType 'application/json' -Body $Body | Out-Null
          } catch {
            Write-Warning 'Staged-source cleanup failed'
          }
